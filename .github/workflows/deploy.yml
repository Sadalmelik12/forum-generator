name: Deploy to GitHub Pages (Manual)

# 关键点：只配 workflow_dispatch（手动触发）。
# 平时你 git push 到 main 不会自动上线，
# 必须到 Actions 页手动点 "Run workflow" 才会发布。
# 网址固定不变：https://<用户名>.github.io/<仓库名>/
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 部署整个仓库根目录的静态文件（index.html / tutorial.html 等）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
